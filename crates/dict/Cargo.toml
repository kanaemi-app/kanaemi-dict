[package]
name = "kanaemi-dict"
description = "Builds Kanaemi's official dictionaries and ranking model from their sources"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
csv = "1.4.0"
kanaemi-engine.workspace = true
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", tag = "v0.7.0", version = "0.7.0" }
thiserror = "2.0.21"
