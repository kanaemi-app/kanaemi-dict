[package]
name = "kanaemi-dict"
description = "Builds Kanaemi's official dictionaries and ranking model from their sources"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
aho-corasick = "1.1.5"
csv = "1.4.0"
kanaemi-core.workspace = true
kanaemi-engine.workspace = true
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sudachi = { git = "https://github.com/WorksApplications/sudachi.rs", tag = "v0.7.0", version = "0.7.0" }
thiserror = "2.0.21"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
