# This workflow is managed by gh actions-lock.

name: Dictionary

on:
  push:
    branches: [main]
    paths:
      - "dictionaries/**"
      - "notices/**"
  workflow_dispatch:

concurrency:
  group: dictionary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      # The dictionaries are built from the sources by hand and committed;
      # this only checks them and gathers each with its notice and license.
      - run: nix develop -c just dist
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: kanaemi-dict
          path: build/dist/
