# This workflow is managed by gh actions-lock.

name: Release

on:
  release:
    types: [published]
  # Attaches the files to a release published before, as this workflow is now.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag of the published release
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - run: nix develop -c just dist
      # One zip a dictionary, its folder inside, and the catalog of them.
      - run: |
          mkdir -p build/release
          for dir in build/dist/*/; do
            name=$(basename "$dir")
            (cd build/dist && zip -qr "../release/kanaemi-$name.zip" "$name")
          done
          cp build/dist/index.json build/release/
      # Releases are made by hand; this only attaches the files.
      - run: gh release upload "$TAG" build/release/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  # The site lists what this release ships, so it is built again once the
  # release holds everything. This repository's token cannot run another
  # repository's workflows, so a token that may run the site's is kept as a
  # secret.
  site:
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: gh workflow run deploy.yml --repo kanaemi-app/kanaemi-app.github.io --ref main
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
